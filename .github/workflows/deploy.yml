name: Déploiement GitHub Pages

on:
  # déploie à chaque push sur la branche de développement
  push:
    branches:
      - claude/photo-app-detourage-xx6191
      - main
  # permet de lancer le déploiement manuellement depuis l'onglet Actions
  workflow_dispatch:

# droits nécessaires au déploiement Pages
permissions:
  contents: read
  pages: write
  id-token: write

# un seul déploiement à la fois
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Construire l'application
        run: npm run build

      - name: Configurer Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Téléverser le build
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Déployer sur GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
